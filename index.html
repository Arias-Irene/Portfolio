<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f3ef;
      color: #222;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 16px 40px;
      background: #ffffff;
      border-bottom: 1px solid #ddd;
    }

    .perfil {
      display: flex;
      align-items: center;
      gap: 12px;
      justify-self: start;
    }

    .perfil img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #222;
    }

    .perfil span {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .titulo-header {
      font-size: 1.5rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      justify-self: center;
    }

    main {
      padding: 48px 32px;
    }

    .botones-secciones {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
      margin-bottom: 64px;
    }

    .botones-secciones a {
      text-decoration: none;
      color: #222;
      background: #fff;
      border: 1px solid #222;
      padding: 12px 22px;
      border-radius: 999px;
      font-weight: 600;
      transition: 0.25s ease;
    }

    .botones-secciones a:hover {
      background: #222;
      color: #fff;
      transform: translateY(-2px);
    }

    section {
      min-height: 80vh;
      max-width: 1100px;
      margin: 0 auto 64px;
      padding: 48px;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    }

    section h2 {
      font-size: 2rem;
      margin-bottom: 16px;
    }

    section p {
      font-size: 1.05rem;
      line-height: 1.7;
      color: #555;
    }

    @media (max-width: 700px) {
      header {
        grid-template-columns: 1fr;
        gap: 12px;
        text-align: center;
        padding: 18px 20px;
      }

      .perfil {
        justify-self: center;
      }

      .titulo-header {
        font-size: 1.2rem;
      }

      main {
        padding: 32px 18px;
      }

      section {
        padding: 32px 24px;
      }
    }
  </style>
</head>
<body>
  <header>
    <div class="perfil">
      <img src="resources/perfilprov.png" alt="Foto de perfil" />
      <span>Irene Arias</span>
    </div>

    <h1 class="titulo-header">Portfolio</h1>

    <div></div>
  </header>

  <main>
    <nav class="botones-secciones" aria-label="Navegación del portfolio">
      <a href="#2danimaciones">2D Animaciones</a>
      <a href="#conceptart">Concept Art</a>
      <a href="#videojuegos">Videojuegos</a>
      <a href="#contacto">Contacto</a>
    </nav>

    <section id="2danimaciones">
      <h2>2D Animaciones</h2>
      <p>UwU</p>
    </section>

    <section id="conceptart">
      <h2>Concept Art</h2>
      <p>UwU</p>
    </section>

    <section id="videojuegos">
      <h2>Videojuegos</h2>
      <p>UwU</p>
    </section>

    <section id="contacto">
      <h2>Contacto</h2>
      <p>UwU</p>
    </section>
  </main>
</body>
</html>
