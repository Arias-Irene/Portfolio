<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portfolio</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f3ef;
      color: #222;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      padding: 16px 40px;
      background: #ffffff;
      border-bottom: 1px solid #ddd;
    }

    .perfil {
      display: flex;
      align-items: center;
      gap: 12px;
      justify-self: start;
    }

    .perfil img {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      object-fit: cover;
      border: 2px solid #222;
    }

    .perfil span {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .titulo-header {
      font-size: 1.5rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      justify-self: center;
    }

    main {
      padding: 48px 32px;
    }

    .botones-secciones {
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
      margin-bottom: 64px;
    }

    .botones-secciones a {
      text-decoration: none;
      color: #222;
      background: #fff;
      border: 1px solid #222;
      padding: 12px 22px;
      border-radius: 999px;
      font-weight: 600;
      transition: 0.25s ease;
    }

    .botones-secciones a:hover {
      background: #222;
      color: #fff;
      transform: translateY(-2px);
    }

    section {
      min-height: 80vh;
      max-width: 1100px;
      margin: 0 auto 64px;
      padding: 48px;
      background: #fff;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.06);
    }

    section h2 {
      font-size: 2rem;
      margin-bottom: 16px;
    }

    section p {
      font-size: 1.05rem;
      line-height: 1.7;
      color: #555;
    }

    @media (max-width: 700px) {
      header {
        grid-template-columns: 1fr;
        gap: 12px;
        text-align: center;
        padding: 18px 20px;
      }

      .perfil {
        justify-self: center;
      }

      .titulo-header {
        font-size: 1.2rem;
      }

      main {
        padding: 32px 18px;
      }

      section {
        padding: 32px 24px;
      }
    }
    .galeria-imagenes {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 22px;
  margin-top: 28px;
}

.tarjeta-imagen {
  overflow: hidden;
  border-radius: 18px;
  background: #f2eee9;
  box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
}

.tarjeta-imagen img {
  width: 100%;
  height: 280px;
  display: block;
  object-fit: cover;
  transition: transform 0.3s ease;
}

.tarjeta-imagen img:hover {
  transform: scale(1.04);
}

.mensaje-galeria {
  margin-top: 24px;
  color: #777;
  font-style: italic;
}
  </style>
</head>
<body>
  <header>
    <div class="perfil">
      <img src="resources/fotoperfil.jpg" alt="Foto de perfil" />
      <span>Irene Arias</span>
    </div>

    <h1 class="titulo-header">Portfolio</h1>

    <div></div>
  </header>

  <main>
    <nav class="botones-secciones" aria-label="Navegación del portfolio">
      <a href="#2danimaciones">2D Animations</a>
      <a href="#conceptart">Concept Art</a>
      <a href="#videojuegos">Videogames</a>
      <a href="#contacto">Contact</a>
    </nav>

    <section id="2danimaciones">
      <h2>2D Animaciones</h2>
      <p>UwU</p>
    </section>

    <section id="conceptart">
  <h2>Concept Art</h2>
  <p>Galería de concept art.</p>

  <div id="conceptart-gallery" class="galeria-imagenes"></div>
  <p id="conceptart-message" class="mensaje-galeria"></p>
</section>

    <section id="videojuegos">
      <h2>Videogames</h2>
      <p>UwU</p>
    </section>

    <section id="contacto">
      <h2>Contact</h2>
      <p>UwU</p>
    </section>
  </main>

  <script>
  async function cargarConceptArt() {
    const galeria = document.getElementById("conceptart-gallery");
    const mensaje = document.getElementById("conceptart-message");

    try {
      const respuesta = await fetch("resources/conceptART.json", {
        cache: "no-store"
      });

      if (!respuesta.ok) {
        throw new Error("No se pudo cargar conceptART.json");
      }

      const imagenes = await respuesta.json();

      if (!Array.isArray(imagenes) || imagenes.length === 0) {
        mensaje.textContent = "Todavía no hay imágenes en la galería.";
        return;
      }

      imagenes.forEach((rutaImagen, index) => {
        const tarjeta = document.createElement("article");
        tarjeta.className = "tarjeta-imagen";

        const imagen = document.createElement("img");
        imagen.src = rutaImagen;
        imagen.alt = `Concept Art ${index + 1}`;
        imagen.loading = "lazy";

        tarjeta.appendChild(imagen);
        galeria.appendChild(tarjeta);
      });
    } catch (error) {
      mensaje.textContent = "No se ha podido cargar la galería de Concept Art.";
      console.error(error);
    }
  }

  document.addEventListener("DOMContentLoaded", cargarConceptArt);
</script>

</body>
</html>
